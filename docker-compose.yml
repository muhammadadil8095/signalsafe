version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./signalsafe.db
      - SECRET_KEY=production-secret-key-change-me-safely
      - VT_API_KEY=${VT_API_KEY:-}
      - VT_ENABLED=${VT_ENABLED:-false}
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend

